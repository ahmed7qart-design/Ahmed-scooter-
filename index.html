<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Scooter GPS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:white;
    color:#111;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px 15px 30px;
}

h1{
    text-align:center;
    font-size:30px;
    margin:5px 0 20px;
}


/* =========================
   العدادات
========================= */

.box{
    background:#f5f5f5;
    border:1px solid #ddd;
    border-radius:18px;
    padding:18px;
    margin-bottom:10px;
    text-align:center;
}

.label{
    display:block;
    color:#666;
    font-size:16px;
    margin-bottom:7px;
}

.value{
    display:block;
    font-size:40px;
    font-weight:bold;
}

.unit{
    display:block;
    color:#777;
    font-size:14px;
    margin-top:3px;
}


/* =========================
   الأزرار
========================= */

.buttons{
    display:flex;
    gap:10px;
    margin:18px 0;
}

button{
    flex:1;
    height:60px;
    border:0;
    border-radius:17px;
    color:white;
    font-size:19px;
    font-weight:bold;
}

#start{
    background:#19a463;
}

#stop{
    background:#e53935;
}

#status{
    text-align:center;
    color:#666;
    margin:12px 0 18px;
}


/* =========================
   الخريطة
========================= */

.map-title{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

#map{
    width:100%;
    height:360px;
    border-radius:20px;
    border:1px solid #ddd;
    overflow:hidden;
}


/* =========================
   سهم السكوتر
========================= */

.scooter-arrow{
    background:transparent !important;
    border:0 !important;
}

.arrow-marker{

    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;
    font-weight:bold;

    color:#0878ff;

    text-shadow:
        0 2px 3px white,
        0 0 5px white;

    transform-origin:center center;

}


/* =========================
   معلومات GPS
========================= */

.info{
    margin-top:15px;
    background:#f5f5f5;
    border-radius:18px;
    padding:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #ddd;
}

.row:last-child{
    border-bottom:0;
}

</style>

</head>


<body>

<div class="app">

<h1>🛴 Scooter GPS</h1>


<!-- السرعة الحالية -->

<div class="box">

<span class="label">
السرعة الحالية
</span>

<span
class="value"
id="currentSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- أعلى سرعة -->

<div class="box">

<span class="label">
أعلى سرعة
</span>

<span
class="value"
id="maxSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- متوسط السرعة -->

<div class="box">

<span class="label">
متوسط السرعة
</span>

<span
class="value"
id="averageSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- المسافة -->

<div class="box">

<span class="label">
المسافة المقطوعة
</span>

<span
class="value"
id="distance">
0.00
</span>

<span class="unit">
كيلومتر
</span>

</div>


<!-- الوقت -->

<div class="box">

<span class="label">
مدة الرحلة
</span>

<span
class="value"
id="time">
00:00:00
</span>

</div>


<!-- الأزرار -->

<div class="buttons">

<button id="start">
▶ تشغيل
</button>

<button id="stop">
■ غلق
</button>

</div>


<div id="status">
🔴 الرحلة متوقفة
</div>


<!-- =========================
     الخريطة
========================= -->

<div class="map-title">
🗺️ موقع السكوتر
</div>

<div id="map"></div>


<!-- =========================
     معلومات GPS
========================= -->

<div class="info">

<div class="row">

<span>
📍 خط العرض
</span>

<strong id="latitude">
--
</strong>

</div>


<div class="row">

<span>
📍 خط الطول
</span>

<strong id="longitude">
--
</strong>

</div>


<div class="row">

<span>
🧭 الاتجاه
</span>

<strong id="direction">
--
</strong>

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =================================
   إنشاء الخريطة
================================= */

const map =
L.map("map").setView(
    [31.2001,29.9187],
    15
);


/* خريطة OpenStreetMap */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


/* =================================
   أيقونة السهم
================================= */

const arrowIcon =
L.divIcon({

    className:"scooter-arrow",

    html:
    '<div class="arrow-marker">⬆</div>',

    iconSize:[50,50],

    iconAnchor:[25,25]

});


/* مؤشر السكوتر */

let scooterMarker = null;


/* خط الطريق */

let routePoints = [];

let routeLine =
L.polyline(
    [],
    {
        color:"#0878ff",
        weight:5,
        opacity:0.8
    }
).addTo(map);


/* =================================
   المتغيرات
================================= */

let running = false;

let watchID = null;

let timerID = null;

let startTime = 0;

let lastPosition = null;

let totalDistance = 0;

let maximumSpeed = 0;

let speedTotal = 0;

let speedCount = 0;


/* =================================
   عناصر الصفحة
================================= */

const currentSpeed =
document.getElementById(
    "currentSpeed"
);

const maxSpeed =
document.getElementById(
    "maxSpeed"
);

const averageSpeed =
document.getElementById(
    "averageSpeed"
);

const distance =
document.getElementById(
    "distance"
);

const time =
document.getElementById(
    "time"
);

const status =
document.getElementById(
    "status"
);

const latitude =
document.getElementById(
    "latitude"
);

const longitude =
document.getElementById(
    "longitude"
);

const direction =
document.getElementById(
    "direction"
);


/* =================================
   زر التشغيل
================================= */

document.getElementById("start")
.onclick = function(){

    if(running){
        return;
    }


    if(!navigator.geolocation){

        status.textContent =
        "⚠️ GPS غير مدعوم في الجهاز";

        return;
    }


    running = true;


    startTime =
    Date.now();


    lastPosition =
    null;


    totalDistance =
    0;


    maximumSpeed =
    0;


    speedTotal =
    0;


    speedCount =
    0;


    routePoints =
    [];


    routeLine.setLatLngs(
        []
    );


    currentSpeed.textContent =
    "0.0";


    maxSpeed.textContent =
    "0.0";


    averageSpeed.textContent =
    "0.0";


    distance.textContent =
    "0.00";


    time.textContent =
    "00:00:00";


    direction.textContent =
    "--";


    status.textContent =
    "🟢 الرحلة تعمل";


    timerID =
    setInterval(
        updateTime,
        1000
    );


    watchID =
    navigator.geolocation.watchPosition(

        updateGPS,

        gpsError,

        {
            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:15000
        }

    );

};


/* =================================
   تحديث GPS
================================= */

function updateGPS(position){

    if(!running){
        return;
    }


    const lat =
    position.coords.latitude;


    const lon =
    position.coords.longitude;


    /* =============================
       السرعة
    ============================= */

    let speed =
    position.coords.speed;


    if(
        speed === null ||
        speed === undefined ||
        !Number.isFinite(speed) ||
        speed < 0
    ){

        speed = 0;

    }


    /* m/s إلى km/h */

    speed =
    speed * 3.6;


    currentSpeed.textContent =
    speed.toFixed(1);


    /* =============================
       أعلى سرعة
    ============================= */

    if(
        speed >
        maximumSpeed
    ){

        maximumSpeed =
        speed;

    }


    maxSpeed.textContent =
    maximumSpeed.toFixed(1);


    /* =============================
       متوسط السرعة
    ============================= */

    speedTotal += speed;

    speedCount++;


    averageSpeed.textContent =

    (
        speedTotal /
        speedCount
    ).toFixed(1);


    /* =============================
       حساب المسافة
    ============================= */

    if(lastPosition !== null){

        const d =
        calculateDistance(

            lastPosition.lat,

            lastPosition.lon,

            lat,

            lon

        );


        /*
        تجاهل قفزات GPS
        غير الطبيعية.
        */

        if(
            d >= 0 &&
            d < 0.2
        ){

            totalDistance += d;

        }

    }


    lastPosition = {

        lat:lat,

        lon:lon

    };


    distance.textContent =
    totalDistance.toFixed(2);


    /* =============================
       إحداثيات الموقع
    ============================= */

    latitude.textContent =
    lat.toFixed(6);


    longitude.textContent =
    lon.toFixed(6);


    /* =============================
       الاتجاه
    ============================= */

    const heading =
    position.coords.heading;


    if(
        heading !== null &&
        Number.isFinite(heading) &&
        heading >= 0
    ){

        direction.textContent =
        getDirection(
            heading
        );


        rotateArrow(
            heading
        );

    }


    /* =============================
       إنشاء / تحريك السهم
    ============================= */

    if(
        scooterMarker === null
    ){

        scooterMarker =
        L.marker(
            [lat,lon],
            {
                icon:arrowIcon
            }
        ).addTo(map);

    }

    else{

        scooterMarker.setLatLng(
            [lat,lon]
        );

    }


    /* =============================
       رسم الطريق
    ============================= */

    routePoints.push(
        [lat,lon]
    );


    routeLine.setLatLngs(
        routePoints
    );


    /* =============================
       تحريك الخريطة
    ============================= */

    map.setView(
        [lat,lon],
        17,
        {
            animate:true
        }
    );

}


/* =================================
   تدوير السهم
================================= */

function rotateArrow(
    degrees
){

    const arrow =
    document.querySelector(
        ".arrow-marker"
    );


    if(!arrow){
        return;
    }


    arrow.style.transform =
    "rotate(" +
    degrees +
    "deg)";

}


/* =================================
   تحديد الاتجاه
================================= */

function getDirection(
    degrees
){

    const directions = [

        "شمال",

        "شمال شرق",

        "شرق",

        "جنوب شرق",

        "جنوب",

        "جنوب غرب",

        "غرب",

        "شمال غرب"

    ];


    const index =
    Math.round(
        degrees / 45
    ) % 8;


    return directions[
        index
    ];

}


/* =================================
   حساب المسافة
================================= */

function calculateDistance(

    lat1,
    lon1,
    lat2,
    lon2

){

    const R =
    6371;


    const dLat =
    (lat2-lat1) *
    Math.PI / 180;


    const dLon =
    (lon2-lon1) *
    Math.PI / 180;


    const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
        lat1 *
        Math.PI / 180
    )

    *

    Math.cos(
        lat2 *
        Math.PI / 180
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


    const c =

    2 *
    Math.atan2(

        Math.sqrt(a),

        Math.sqrt(1-a)

    );


    return R * c;

}


/* =================================
   الوقت
================================= */

function updateTime(){

    if(!running){
        return;
    }


    const seconds =

    Math.floor(

        (
            Date.now() -
            startTime
        ) / 1000

    );


    const hours =

    Math.floor(
        seconds / 3600
    );


    const minutes =

    Math.floor(

        (seconds % 3600) /
        60

    );


    const secs =
    seconds % 60;


    time.textContent =

    String(hours)
    .padStart(2,"0")

    + ":" +

    String(minutes)
    .padStart(2,"0")

    + ":" +

    String(secs)
    .padStart(2,"0");

}


/* =================================
   زر الغلق
================================= */

document.getElementById("stop")
.onclick = function(){

    if(!running){
        return;
    }


    running = false;


    if(
        watchID !== null
    ){

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;

    }


    if(
        timerID !== null
    ){

        clearInterval(
            timerID
        );

        timerID = null;

    }


    currentSpeed.textContent =
    "0.0";


    status.textContent =
    "🔴 الرحلة متوقفة";

};


/* =================================
   أخطاء GPS
================================= */

function gpsError(error){

    if(error.code === 1){

        status.textContent =
        "⚠️ اسمح للتطبيق باستخدام الموقع";

    }

    else if(error.code === 2){

        status.textContent =
        "⚠️ تعذر تحديد موقعك";

    }

    else if(error.code === 3){

        status.textContent =
        "⚠️ انتهت مهلة GPS";

    }

    else{

        status.textContent =
        "⚠️ حدث خطأ في GPS";

    }

}

</script>

</body>
</html>
