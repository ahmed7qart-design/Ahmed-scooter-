<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHMED SCOOTER</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 92%;
      max-width: 430px;
      margin: auto;
      padding: 25px 0;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 18px;
    }

    #status {
      background: #151515;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 7px 0;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #permissionBtn {
      background: #f59e0b;
      color: white;
    }

    #locationBtn {
      background: #1877f2;
      color: white;
    }

    #startBtn {
      background: #16a34a;
      color: white;
    }

    #bluetoothBtn {
      background: #673ab7;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    #map {
      width: 100%;
      height: 280px;
      margin-top: 15px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #222;
    }

    #services {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #151515;
      border-radius: 14px;
      text-align: left;
      direction: ltr;
      max-height: 180px;
      overflow-y: auto;
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🛴 AHMED SCOOTER</h1>

  <div class="subtitle">
    نظام متابعة السكوتر
  </div>

  <div id="status">
    📍 السماح بالموقع مطلوب
  </div>

  <button id="permissionBtn">
    📍 السماح للخريطة بالموقع
  </button>

  <button id="locationBtn">
    📍 تحديد موقعي
  </button>

  <div id="map"></div>

  <button id="startBtn">
    🚀 بدء الرحلة
  </button>

  <button id="bluetoothBtn">
    🔵 اتصال Bluetooth
  </button>

  <div id="services">
    لم يتم الاتصال بعد.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const statusBox =
  document.getElementById("status");

const permissionBtn =
  document.getElementById("permissionBtn");

const locationBtn =
  document.getElementById("locationBtn");

const startBtn =
  document.getElementById("startBtn");

const bluetoothBtn =
  document.getElementById("bluetoothBtn");

const servicesBox =
  document.getElementById("services");


// ==========================
// الخريطة
// ==========================

const map =
  L.map("map").setView(
    [31.2001, 29.9187],
    13
  );

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);

let marker = null;


// ==========================
// زر السماح بالموقع
// ==========================

permissionBtn.addEventListener(
  "click",
  () => {

    if (!navigator.geolocation) {

      statusBox.textContent =
        "❌ جهازك لا يدعم تحديد الموقع";

      return;
    }

    statusBox.textContent =
      "🟡 اختر السماح بالموقع...";

    navigator.geolocation.getCurrentPosition(

      (position) => {

        permissionBtn.textContent =
          "✅ تم السماح بالموقع";

        permissionBtn.style.background =
          "#16a34a";

        statusBox.textContent =
          "🟢 تم السماح بالموقع";

        showLocation(position);

      },

      (error) => {

        console.log(error);

        statusBox.textContent =
          "🔴 لم يتم السماح بالموقع";

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  }
);


// ==========================
// تحديد الموقع
// ==========================

locationBtn.addEventListener(
  "click",
  () => {

    if (!navigator.geolocation) {

      statusBox.textContent =
        "❌ تحديد الموقع غير مدعوم";

      return;
    }

    statusBox.textContent =
      "🟡 جاري تحديد موقعك...";

    navigator.geolocation.getCurrentPosition(

      showLocation,

      () => {

        statusBox.textContent =
          "🔴 تعذر تحديد الموقع";

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  }
);


// ==========================
// عرض الموقع على الخريطة
// ==========================

function showLocation(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  map.setView(
    [lat, lon],
    17
  );

  if (marker) {
    map.removeLayer(marker);
  }

  marker =
    L.marker(
      [lat, lon]
    ).addTo(map);

  marker
    .bindPopup("📍 موقعك الحالي")
    .openPopup();

  statusBox.textContent =
    "🟢 موقعك ظاهر على الخريطة";
}


// ==========================
// بدء الرحلة
// ==========================

startBtn.addEventListener(
  "click",
  () => {

    statusBox.textContent =
      "🟢 الرحلة بدأت";

    startBtn.textContent =
      "🛴 الرحلة جارية";

  }
);


// ==========================
// Bluetooth
// ==========================

let device = null;
let server = null;

bluetoothBtn.addEventListener(
  "click",
  async () => {

    if (!navigator.bluetooth) {

      statusBox.textContent =
        "❌ Bluetooth غير مدعوم";

      return;
    }

    try {

      statusBox.textContent =
        "🟡 اختر جهاز Bluetooth...";

      device =
        await navigator.bluetooth.requestDevice({

          acceptAllDevices: true,

          optionalServices: [
            "battery_service",
            "device_information"
          ]

        });

      statusBox.textContent =
        "🟡 جاري الاتصال...";

      server =
        await device.gatt.connect();

      statusBox.textContent =
        "🟢 Bluetooth متصل";

      bluetoothBtn.textContent =
        "🟢 Bluetooth متصل";

      servicesBox.style.display =
        "block";

      servicesBox.textContent =
        "🔍 جاري قراءة الخدمات...";

      const services =
        await server.getPrimaryServices();

      servicesBox.innerHTML = "";

      services.forEach(
        (service) => {

          const line =
            document.createElement("div");

          line.textContent =
            "Service: " +
            service.uuid;

          servicesBox.appendChild(line);

        }
      );

      device.addEventListener(
        "gattserverdisconnected",
        () => {

          statusBox.textContent =
            "🔴 Bluetooth غير متصل";

          bluetoothBtn.textContent =
            "🔵 اتصال Bluetooth";

        }
      );

    } catch (error) {

      console.log(error);

      statusBox.textContent =
        "🔴 لم يتم الاتصال";

    }

  }
);

</script>

</body>
</html>
