<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AHMED SCOOTER</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 92%;
      max-width: 430px;
      text-align: center;
      padding: 20px 0;
    }

    h1 {
      margin: 0 0 10px;
    }

    #status {
      margin: 15px 0;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #connect {
      background: #1877f2;
      color: white;
    }

    #location {
      background: #222;
      color: white;
    }

    #services {
      margin-top: 15px;
      padding: 12px;
      background: #151515;
      border-radius: 14px;
      text-align: left;
      direction: ltr;
      max-height: 180px;
      overflow-y: auto;
      font-size: 12px;
      word-break: break-all;
    }

    #map {
      width: 100%;
      height: 260px;
      margin-top: 15px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #222;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🛴 AHMED SCOOTER</h1>

  <div id="status">
    🔴 Bluetooth غير متصل
  </div>

  <button id="connect">
    🔵 اكتشاف Bluetooth
  </button>

  <button id="location">
    📍 تحديد موقعي
  </button>

  <div id="map"></div>

  <div id="services">
    لم يتم اكتشاف خدمات Bluetooth بعد.
  </div>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

let device = null;
let server = null;

const statusBox =
  document.getElementById("status");

const servicesBox =
  document.getElementById("services");

const connectBtn =
  document.getElementById("connect");

const locationBtn =
  document.getElementById("location");


// ==========================
// Bluetooth
// ==========================

connectBtn.addEventListener("click", async () => {

  if (!navigator.bluetooth) {

    statusBox.textContent =
      "❌ جهازك لا يدعم Web Bluetooth";

    return;
  }

  try {

    statusBox.textContent =
      "🟡 اختر جهاز Bluetooth...";

    device =
      await navigator.bluetooth.requestDevice({

        acceptAllDevices: true,

        optionalServices: [
          "battery_service",
          "device_information"
        ]

      });


    statusBox.textContent =
      "🟡 جاري الاتصال بـ " +
      (device.name || "جهاز غير معروف");


    device.addEventListener(
      "gattserverdisconnected",
      disconnected
    );


    server =
      await device.gatt.connect();


    statusBox.textContent =
      "🟢 متصل بـ " +
      (device.name || "جهاز غير معروف");


    servicesBox.textContent =
      "🔍 جاري قراءة خدمات Bluetooth...";


    const services =
      await server.getPrimaryServices();


    servicesBox.innerHTML = "";


    if (services.length === 0) {

      servicesBox.textContent =
        "⚠️ لم يتم العثور على خدمات GATT.";

      return;
    }


    services.forEach(service => {

      const line =
        document.createElement("div");

      line.textContent =
        "Service: " + service.uuid;

      servicesBox.appendChild(line);

    });


    servicesBox.innerHTML +=
      "<br>⚠️ لم يتم إرسال أي أوامر تحكم للسكوتر.";


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "🔴 لم يتم الاتصال";

    servicesBox.textContent =
      "السبب: "
