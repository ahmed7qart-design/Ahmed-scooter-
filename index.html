<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHMED SCOOTER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .status {
      margin: 15px 0 30px;
      color: #ff3333;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 0;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #connect {
      background: #1877f2;
      color: white;
    }

    #unlock {
      background: #18a558;
      color: white;
    }

    #lock {
      background: #e53935;
      color: white;
    }

    button:disabled {
      background: #333 !important;
      color: #777 !important;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>🛴 AHMED SCOOTER</h1>

    <div class="status" id="status">
      🔴 غير متصل
    </div>

    <button id="connect">🔵 اتصال Bluetooth</button>

    <button id="unlock" disabled>
      🔓 فتح السكوتر
    </button>

    <button id="lock" disabled>
      🔒 قفل السكوتر
    </button>
  </div>

  <script>
    let bluetoothDevice = null;

    const connectButton = document.getElementById("connect");
    const unlockButton = document.getElementById("unlock");
    const lockButton = document.getElementById("lock");
    const statusText = document.getElementById("status");

    connectButton.addEventListener("click", async () => {
      if (!navigator.bluetooth) {
        alert("المتصفح أو الجهاز لا يدعم Web Bluetooth.");
        return;
      }

      try {
        statusText.textContent = "🟡 جاري البحث عن جهاز...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });

        const server = await bluetoothDevice.gatt.connect();

        if (server.connected) {
          statusText.textContent = "🟢 متصل بالسكوتر";
          unlockButton.disabled = false;
          lockButton.disabled = false;
          connectButton.textContent = "🟢 متصل";
          connectButton.disabled = true;
        }

        bluetoothDevice.addEventListener("gattserverdisconnected", () => {
          statusText.textContent = "🔴 تم قطع الاتصال";
          unlockButton.disabled = true;
          lockButton.disabled = true;
          connectButton.disabled = false;
          connectButton.textContent = "🔵 اتصال Bluetooth";
        });

      } catch (error) {
        statusText.textContent = "🔴 غير متصل";
        console.log(error);
      }
    });

    unlockButton.addEventListener("click", () => {
      alert("اتصل السكوتر، لكن أمر الفتح يحتاج بروتوكول السكوتر الحقيقي.");
    });

    lockButton.addEventListener("click", () => {
      alert("اتصل السكوتر، لكن أمر القفل يحتاج بروتوكول السكوتر الحقيقي.");
    });
  </script>

</body>
</html>
