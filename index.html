<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHMED SCOOTER</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  text-align: center;
  color: #ff2020;
  margin-bottom: 30px;
}

.card {
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  text-align: center;
}

.title {
  color: #aaa;
  font-size: 15px;
}

.value {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #e60000;
  color: white;
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

button:active {
  transform: scale(.98);
}

.status {
  text-align: center;
  color: #aaa;
  margin: 15px;
}

/* الخريطة */

.map-card {
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 18px;
  padding: 12px;
  margin-bottom: 14px;
}

.map-title {
  text-align: center;
  color: #aaa;
  margin-bottom: 10px;
}

#map {
  width: 100%;
  height: 260px;
  border-radius: 14px;
}

/* سهم الموقع */

.scooter-arrow {
  background: transparent;
  border: none;
}

.scooter-arrow div {
  color: #1683ff;
  font-size: 36px;
  font-weight: bold;
  text-shadow:
    0 0 3px white,
    0 0 8px #1683ff;
  transition: transform 0.15s linear;
}

</style>

</head>

<body>

<div class="container">

<h1>🛴 AHMED SCOOTER</h1>

<div class="card">
  <div class="title">السرعة الحالية</div>
  <div class="value" id="speed">0.0 km/h</div>
</div>

<div class="card">
  <div class="title">المسافة</div>
  <div class="value" id="distance">0.00 km</div>
</div>

<div class="card">
  <div class="title">وقت الرحلة</div>
  <div class="value" id="time">00:00</div>
</div>

<div class="card">
  <div class="title">السعرات التقديرية</div>
  <div class="value" id="calories">0 kcal</div>
</div>

<div class="map-card">

  <div class="map-title">
    🗺️ الخريطة
  </div>

  <div id="map"></div>

</div>

<button id="startBtn" onclick="toggleRide()">
  ▶️ ابدأ الرحلة
</button>

<div class="status" id="status">
  الرحلة متوقفة
</div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

let running = false;
let watchId = null;

let lastPosition = null;
let totalDistance = 0;

let startTime = 0;
let timer = null;

let userMarker = null;

/* اتجاه البوصلة */
let compassHeading = 0;


/* =========================
   الخريطة
========================= */

const map = L.map("map").setView(
  [31.2001, 29.9187],
  13
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   سهم الموقع
========================= */

function createArrowIcon(heading) {

  return L.divIcon({

    className:
      "scooter-arrow",

    html:
      `<div style="transform:rotate(${heading}deg)">
        ▲
      </div>`,

    iconSize: [
      40,
      40
    ],

    iconAnchor: [
      20,
      20
    ]

  });

}


/* =========================
   البوصلة
========================= */

function updateCompass(event) {

  let heading = null;


  /*
    أجهزة iPhone / Safari
  */

  if (
    typeof event.webkitCompassHeading ===
    "number"
  ) {

    heading =
      event.webkitCompassHeading;

  }


  /*
    Android وبعض المتصفحات
  */

  else if (
    typeof event.alpha ===
    "number"
  ) {

    heading =
      360 - event.alpha;

  }


  if (
    heading === null ||
    isNaN(heading)
  ) {

    return;

  }


  compassHeading =
    heading;


  /*
    لف السهم فورًا
  */

  if (userMarker) {

    userMarker.setIcon(
      createArrowIcon(
        compassHeading
      )
    );

  }

}


/*
  مستشعر اتجاه الهاتف
*/

window.addEventListener(
  "deviceorientationabsolute",
  updateCompass,
  true
);

window.addEventListener(
  "deviceorientation",
  updateCompass,
  true
);


/* =========================
   الرحلة
========================= */

function toggleRide() {

  if (!running) {

    startRide();

  } else {

    stopRide();

  }

}


function startRide() {

  if (!navigator.geolocation) {

    alert(
      "المتصفح لا يدعم GPS"
    );

    return;

  }


  running = true;

  totalDistance = 0;

  lastPosition = null;

  startTime = Date.now();


  document.getElementById(
    "startBtn"
  ).innerHTML =
    "⏹️ إيقاف الرحلة";


  document.getElementById(
    "status"
  ).innerHTML =
    "🟢 الرحلة تعمل";


  timer =
    setInterval(
      updateTime,
      1000
    );


  watchId =
    navigator.geolocation.watchPosition(

      updateLocation,

      locationError,

      {
        enableHighAccuracy: true,

        maximumAge: 1000,

        timeout: 10000
      }

    );

}


/* =========================
   إيقاف الرحلة
========================= */

function stopRide() {

  running = false;


  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId = null;

  }


  clearInterval(timer);


  document.getElementById(
    "startBtn"
  ).innerHTML =
    "▶️ ابدأ الرحلة";


  document.getElementById(
    "status"
  ).innerHTML =
    "🔴 الرحلة متوقفة";

}


/* =========================
   تحديث GPS
========================= */

function updateLocation(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  /*
    السرعة
  */

  const speed =
    position.coords.speed;


  if (
    speed !== null &&
    speed >= 0
  ) {

    document.getElementById(
      "speed"
    ).innerHTML =
      (speed * 3.6).toFixed(1) +
      " km/h";

  }


  /*
    المسافة
  */

  if (lastPosition) {

    const distance =
      calculateDistance(

        lastPosition.lat,

        lastPosition.lon,

        lat,

        lon

      );


    if (distance < 100) {

      totalDistance +=
        distance;


      document.getElementById(
        "distance"
      ).innerHTML =
        (
          totalDistance / 1000
        ).toFixed(2) +
        " km";


      const calories =
        (
          totalDistance / 1000
        ) * 35;


      document.getElementById(
        "calories"
      ).innerHTML =
        calories.toFixed(0) +
        " kcal";

    }

  }


  lastPosition = {

    lat: lat,

    lon: lon

  };


  /*
    تحريك الخريطة والسهم
  */

  updateMap(position);

}


/* =========================
   الخريطة والسهم
========================= */

function updateMap(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  /*
    الخريطة تتحرك مع الموقع
  */

  map.setView(

    [lat, lon],

    17,

    {
      animate: true
    }

  );


  /*
    إنشاء السهم
  */

  if (!userMarker) {

    userMarker =
      L.marker(

        [lat, lon],

        {
          icon:
            createArrowIcon(
              compassHeading
            )
        }

      ).addTo(map);

  }


  /*
    تحريك السهم
  */

  else {

    userMarker.setLatLng(
      [lat, lon]
    );


    userMarker.setIcon(

      createArrowIcon(
        compassHeading
      )

    );

  }

}


/* =========================
   الوقت
========================= */

function updateTime() {

  if (!running) {

    return;

  }


  const seconds =
    Math.floor(

      (
        Date.now() -
        startTime
      ) / 1000

    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const sec =
    seconds % 60;


  document.getElementById(
    "time"
  ).innerHTML =

    String(minutes)
      .padStart(2, "0") +

    ":" +

    String(sec)
      .padStart(2, "0");

}


/* =========================
   حساب المسافة
========================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const dLat =
    (
      lat2 - lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 - lon1
    ) *
    Math.PI /
    180;


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      lat1 *
      Math.PI /
      180
    )

    *

    Math.cos(
      lat2 *
      Math.PI /
      180
    )

    *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );


  return R * c;

}


/* =========================
   خطأ GPS
========================= */

function locationError() {

  document.getElementById(
    "status"
  ).innerHTML =
    "⚠️ لازم تسمح للتطبيق باستخدام الموقع";

}

</script>

</body>
</html>
