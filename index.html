<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Scooter GPS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#ffffff;
    color:#111111;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px 15px 30px;
}

h1{
    text-align:center;
    font-size:30px;
    margin:5px 0 20px;
}


/* العدادات */

.box{
    background:#f5f5f5;
    border:1px solid #dddddd;
    border-radius:18px;
    padding:18px;
    margin-bottom:10px;
    text-align:center;
}

.label{
    display:block;
    color:#666666;
    font-size:16px;
    margin-bottom:7px;
}

.value{
    display:block;
    font-size:40px;
    font-weight:bold;
}

.unit{
    display:block;
    color:#777777;
    font-size:14px;
    margin-top:3px;
}


/* الأزرار */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

button{
    border:0;
    border-radius:17px;
    height:60px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#start{
    background:#19a463;
}

#stop{
    background:#e53935;
}

#bluetooth{
    width:100%;
    margin-top:10px;
    background:#1976d2;
}

#status{
    text-align:center;
    color:#666666;
    margin:13px 0 18px;
}

#bluetoothStatus{
    text-align:center;
    color:#666666;
    margin:10px 0 18px;
}


/* الخريطة */

.map-title{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

#map{
    width:100%;
    height:360px;
    border-radius:20px;
    border:1px solid #dddddd;
    overflow:hidden;
}


/* سهم السكوتر */

.scooter-arrow{
    background:transparent !important;
    border:0 !important;
}

.arrow-marker{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;
    font-weight:bold;

    color:#0878ff;

    text-shadow:
        0 2px 3px white,
        0 0 5px white;

    transform-origin:center center;
}


/* معلومات GPS */

.info{
    margin-top:15px;
    background:#f5f5f5;
    border-radius:18px;
    padding:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #dddddd;
}

.row:last-child{
    border-bottom:0;
}

</style>

</head>


<body>

<div class="app">

<h1>🛴 Scooter GPS</h1>


<!-- السرعة الحالية -->

<div class="box">

<span class="label">
السرعة الحالية
</span>

<span
class="value"
id="currentSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- أعلى سرعة -->

<div class="box">

<span class="label">
أعلى سرعة
</span>

<span
class="value"
id="maxSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- متوسط السرعة -->

<div class="box">

<span class="label">
متوسط السرعة
</span>

<span
class="value"
id="averageSpeed">
0.0
</span>

<span class="unit">
كم / ساعة
</span>

</div>


<!-- المسافة -->

<div class="box">

<span class="label">
المسافة المقطوعة
</span>

<span
class="value"
id="distance">
0.00
</span>

<span class="unit">
كيلومتر
</span>

</div>


<!-- الوقت -->

<div class="box">

<span class="label">
مدة الرحلة
</span>

<span
class="value"
id="time">
00:00:00
</span>

</div>


<!-- تشغيل وغلق -->

<div class="buttons">

<button
id="start"
type="button">
▶ تشغيل
</button>

<button
id="stop"
type="button">
■ غلق
</button>

</div>


<!-- Bluetooth -->

<button
id="bluetooth"
type="button">
🔵 اتصال Bluetooth
</button>


<div id="bluetoothStatus">
🔵 Bluetooth: غير متصل
</div>


<div id="status">
🔴 الرحلة متوقفة
</div>


<!-- الخريطة -->

<div class="map-title">
🗺️ موقع السكوتر
</div>

<div id="map"></div>


<!-- معلومات GPS -->

<div class="info">

<div class="row">

<span>
📍 خط العرض
</span>

<strong id="latitude">
--
</strong>

</div>


<div class="row">

<span>
📍 خط الطول
</span>

<strong id="longitude">
--
</strong>

</div>


<div class="row">

<span>
🧭 الاتجاه
</span>

<strong id="direction">
--
</strong>

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================
   الخريطة
========================== */

const map =
L.map("map").setView(
    [31.2001,29.9187],
    15
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


/* ==========================
   سهم السكوتر
========================== */

const arrowIcon =
L.divIcon({

    className:"scooter-arrow",

    html:
    '<div class="arrow-marker">⬆</div>',

    iconSize:[50,50],

    iconAnchor:[25,25]

});


let scooterMarker = null;


/* خط الرحلة */

let routePoints = [];

let routeLine =
L.polyline(
    [],
    {
        color:"#0878ff",
        weight:5,
        opacity:0.8
    }
).addTo(map);


/* ==========================
   المتغيرات
========================== */

let running = false;

let watchID = null;

let timerID = null;

let startTime = 0;

let lastPosition = null;

let totalDistance = 0;

let maximumSpeed = 0;

let speedTotal = 0;

let speedCount = 0;


/* Bluetooth */

let bluetoothDevice = null;


/* ==========================
   العناصر
========================== */

const currentSpeed =
document.getElementById(
    "currentSpeed"
);

const maxSpeed =
document.getElementById(
    "maxSpeed"
);

const averageSpeed =
document.getElementById(
    "averageSpeed"
);

const distance =
document.getElementById(
    "distance"
);

const time =
document.getElementById(
    "time"
);

const status =
document.getElementById(
    "status"
);

const latitude =
document.getElementById(
    "latitude"
);

const longitude =
document.getElementById(
    "longitude"
);

const direction =
document.getElementById(
    "direction"
);

const bluetoothStatus =
document.getElementById(
    "bluetoothStatus"
);


/* ==========================
   تشغيل الرحلة
========================== */

document.getElementById("start")
.onclick = function(){

    if(running){
        return;
    }


    if(!navigator.geolocation){

        status.textContent =
        "⚠️ GPS غير مدعوم";

        return;
    }


    running = true;

    startTime =
    Date.now();

    lastPosition =
    null;

    totalDistance =
    0;

    maximumSpeed =
    0;

    speedTotal =
    0;

    speedCount =
    0;

    routePoints =
    [];

    routeLine.setLatLngs(
        []
    );


    currentSpeed.textContent =
    "0.0";

    maxSpeed.textContent =
    "0.0";

    averageSpeed.textContent =
    "0.0";

    distance.textContent =
    "0.00";

    time.textContent =
    "00:00:00";


    status.textContent =
    "🟢 الرحلة تعمل";


    timerID =
    setInterval(
        updateTime,
        1000
    );


    watchID =
    navigator.geolocation.watchPosition(

        updateGPS,

        gpsError,

        {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:15000
        }

    );

};


/* ==========================
   GPS
========================== */

function updateGPS(position){

    if(!running){
        return;
    }


    const lat =
    position.coords.latitude;

    const lon =
    position.coords.longitude;


    /* السرعة */

    let speed =
    position.coords.speed;


    if(
        speed === null ||
        speed === undefined ||
        !Number.isFinite(speed) ||
        speed < 0
    ){

        speed = 0;

    }


    /* متر/ثانية إلى كم/ساعة */

    speed =
    speed * 3.6;


    currentSpeed.textContent =
    speed.toFixed(1);


    /* أعلى سرعة */

    if(
        speed >
        maximumSpeed
    ){

        maximumSpeed =
        speed;

    }


    maxSpeed.textContent =
    maximumSpeed.toFixed(1);


    /* متوسط السرعة */

    speedTotal +=
    speed;

    speedCount++;


    averageSpeed.textContent =

    (
        speedTotal /
        speedCount
    ).toFixed(1);


    /* المسافة */

    if(
        lastPosition !== null
    ){

        const d =
        calculateDistance(

            lastPosition.lat,
            lastPosition.lon,

            lat,
            lon

        );


        if(
            d >= 0 &&
            d < 0.2
        ){

            totalDistance +=
            d;

        }

    }


    lastPosition = {

        lat:lat,
        lon:lon

    };


    distance.textContent =
    totalDistance.toFixed(2);


    /* GPS */

    latitude.textContent =
    lat.toFixed(6);

    longitude.textContent =
    lon.toFixed(6);


    /* الاتجاه */

    const heading =
    position.coords.heading;


    if(
        heading !== null &&
        Number.isFinite(heading) &&
        heading >= 0
    ){

        direction.textContent =
        getDirection(
            heading
        );

        rotateArrow(
            heading
        );

    }


    /* السهم */

    if(
        scooterMarker === null
    ){

        scooterMarker =
        L.marker(
            [lat,lon],
            {
                icon:arrowIcon
            }
        ).addTo(map);

    }

    else{

        scooterMarker.setLatLng(
            [lat,lon]
        );

    }


    /* رسم الطريق */

    routePoints.push(
        [lat,lon]
    );


    routeLine.setLatLngs(
        routePoints
    );


    /* تحريك الخريطة */

    map.setView(
        [lat,lon],
        17,
        {
            animate:true
        }
    );

}


/* ==========================
   تدوير السهم
========================== */

function rotateArrow(
    degrees
){

    const arrow =
    document.querySelector(
        ".arrow-marker"
    );


    if(!arrow){
        return;
    }


    arrow.style.transform =
    "rotate(" +
    degrees +
    "deg)";

}


/* ==========================
   الاتجاه
========================== */

function getDirection(
    degrees
){

    const directions = [

        "شمال",
        "شمال شرق",
        "شرق",
        "جنوب شرق",
        "جنوب",
        "جنوب غرب",
        "غرب",
        "شمال غرب"

    ];


    const index =
    Math.round(
        degrees / 45
    ) % 8;


    return directions[index];

}


/* ==========================
   حساب المسافة
========================== */

function calculateDistance(

    lat1,
    lon1,

    lat2,
    lon2

){

    const R =
    6371;


    const dLat =
    (lat2-lat1) *
    Math.PI / 180;


    const dLon =
    (lon2-lon1) *
    Math.PI / 180;


    const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
        lat1 *
        Math.PI / 180
    )

    *

    Math.cos(
        lat2 *
        Math.PI / 180
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


    const c =
    2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );


    return R * c;

}


/* ==========================
   الوقت
========================== */

function updateTime(){

    if(!running){
        return;
    }


    const seconds =
    Math.floor(

        (
            Date.now() -
            startTime
        ) / 1000

    );


    const hours =
    Math.floor(
        seconds / 3600
    );


    const minutes =
    Math.floor(

        (seconds % 3600) /
        60

    );


    const secs =
    seconds % 60;


    time.textContent =

    String(hours)
    .padStart(2,"0")

    + ":" +

    String(minutes)
    .padStart(2,"0")

    + ":" +

    String(secs)
    .padStart(2,"0");

}


/* ==========================
   غلق الرحلة
========================== */

document.getElementById("stop")
.onclick = function(){

    if(!running){
        return;
    }


    running = false;


    if(
        watchID !== null
    ){

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;

    }


    if(
        timerID !== null
    ){

        clearInterval(
            timerID
        );

        timerID = null;

    }


    currentSpeed.textContent =
    "0.0";


    status.textContent =
    "🔴 الرحلة متوقفة";

};


/* ==========================
   Bluetooth
========================== */

document.getElementById("bluetooth")
.onclick = async function(){

    /*
    التأكد من دعم Web Bluetooth
    */

    if(
        !navigator.bluetooth
    ){

        bluetoothStatus.textContent =
        "❌ غير مدعوم";

        status.textContent =
        "⚠️ المتصفح لا يدعم Bluetooth";

        return;
    }


    try{

        bluetoothStatus.textContent =
        "🔵 جاري البحث...";


        status.textContent =
        "🔵 اختر جهاز السكوتر";


        /*
        فتح قائمة أجهزة Bluetooth
        */

        bluetoothDevice =
        await navigator.bluetooth.requestDevice({

            acceptAllDevices:true

        });


        if(
            !bluetoothDevice
        ){

            throw new Error(
                "No device"
            );

        }


        bluetoothStatus.textContent =
        "🟡 تم اختيار الجهاز";


        /*
        محاولة الاتصال
        */

        if(
            bluetoothDevice.gatt
        ){

            await bluetoothDevice.gatt.connect();


            bluetoothStatus.textContent =
            "🟢 متصل";

            status.textContent =
            "🟢 Bluetooth متصل";

        }

        else{

            bluetoothStatus.textContent =
            "🟡 تم الاختيار";

        }


        /*
        عند فصل الجهاز
        */

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            function(){

                bluetoothStatus.textContent =
                "🔴 غير متصل";

                status.textContent =
                "🔴 Bluetooth انفصل";

            }
        );

    }

    catch(error){

        console.log(
            error
        );


        bluetoothStatus.textContent =
        "🔴 غير متصل";


        status.textContent =
        "لم يتم الاتصال";

    }

};


/* ==========================
   خطأ GPS
========================== */

function gpsError(error){

    if(
        error.code === 1
    ){

        status.textContent =
        "⚠️ اسمح للتطبيق بالموقع";

    }

    else if(
        error.code === 2
    ){

        status.textContent =
        "⚠️ تعذر تحديد الموقع";

    }

    else if(
        error.code === 3
    ){

        status.textContent =
        "⚠️ انتهت مهلة GPS";

    }

    else{

        status.textContent =
        "⚠️ حدث خطأ في GPS";

    }

}

</script>

</body>
    </html>
