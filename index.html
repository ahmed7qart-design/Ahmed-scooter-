<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHMED SCOOTER</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  text-align: center;
  color: #ff2020;
  margin-bottom: 30px;
}

.card {
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  text-align: center;
}

.title {
  color: #aaa;
  font-size: 15px;
}

.value {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #e60000;
  color: white;
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

button:active {
  transform: scale(.98);
}

.status {
  text-align: center;
  color: #aaa;
  margin: 15px;
}

/* الخريطة فقط */

.map-card {
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 18px;
  padding: 12px;
  margin-bottom: 14px;
}

.map-title {
  text-align: center;
  color: #aaa;
  margin-bottom: 10px;
}

#map {
  width: 100%;
  height: 260px;
  border-radius: 14px;
}

/* سهم الموقع */

.scooter-arrow {
  background: transparent;
  border: none;
}

.scooter-arrow div {
  color: #1683ff;
  font-size: 36px;
  font-weight: bold;
  text-shadow:
    0 0 3px white,
    0 0 8px #1683ff;
}

</style>

</head>

<body>

<div class="container">

<h1>🛴 AHMED SCOOTER</h1>

<div class="card">
  <div class="title">السرعة الحالية</div>
  <div class="value" id="speed">0.0 km/h</div>
</div>

<div class="card">
  <div class="title">المسافة</div>
  <div class="value" id="distance">0.00 km</div>
</div>

<div class="card">
  <div class="title">وقت الرحلة</div>
  <div class="value" id="time">00:00</div>
</div>

<div class="card">
  <div class="title">السعرات التقديرية</div>
  <div class="value" id="calories">0 kcal</div>
</div>

<!-- الخريطة -->

<div class="map-card">

  <div class="map-title">
    🗺️ الخريطة
  </div>

  <div id="map"></div>

</div>

<button id="startBtn" onclick="toggleRide()">
  ▶️ ابدأ الرحلة
</button>

<div class="status" id="status">
  الرحلة متوقفة
</div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let running = false;
let watchId = null;

let lastPosition = null;
let totalDistance = 0;

let startTime = 0;
let timer = null;

let userMarker = null;


/* =========================
   الخريطة
========================= */

const map = L.map("map").setView(
  [31.2001, 29.9187],
  13
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   سهم الموقع
========================= */

function createArrowIcon(heading) {

  return L.divIcon({

    className:
      "scooter-arrow",

    html:
      `<div style="transform:rotate(${heading}deg)">
        ▲
      </div>`,

    iconSize: [
      40,
      40
    ],

    iconAnchor: [
      20,
      20
    ]

  });

}


/* =========================
   الرحلة
========================= */

  if (!running) {

    startRide();

  } else {

    stopRide();

  }

}
