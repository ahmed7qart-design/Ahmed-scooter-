<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHMED SCOOTER</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 430px;
      text-align: center;
    }

    h1 { margin-bottom: 10px; }

    #status {
      margin: 15px 0;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 14px;
      font-size: 19px;
      font-weight: bold;
    }

    #connect {
      background: #1877f2;
      color: white;
    }

    button:disabled {
      background: #333;
      color: #777;
    }

    #services {
      margin-top: 20px;
      padding: 15px;
      background: #151515;
      border-radius: 14px;
      text-align: left;
      direction: ltr;
      max-height: 250px;
      overflow-y: auto;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🛴 AHMED SCOOTER</h1>

  <div id="status">🔴 غير متصل</div>

  <button id="connect">
    🔵 اكتشاف السكوتر
  </button>

  <button id="unlock" disabled>
    🔓 فتح السكوتر
  </button>

  <button id="lock" disabled>
    🔒 قفل السكوتر
  </button>

  <div id="services">
    لم يتم اكتشاف خدمات Bluetooth بعد.
  </div>

</div>

<script>
let device = null;
let server = null;

const connectBtn = document.getElementById("connect");
const unlockBtn = document.getElementById("unlock");
const lockBtn = document.getElementById("lock");
const statusBox = document.getElementById("status");
const servicesBox = document.getElementById("services");

connectBtn.addEventListener("click", async () => {

  if (!navigator.bluetooth) {
    statusBox.textContent =
      "❌ المتصفح لا يدعم Web Bluetooth";
    return;
  }

  try {

    statusBox.textContent = "🟡 اختر جهاز Bluetooth...";

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        "battery_service",
        "device_information"
      ]
    });

    statusBox.textContent =
      "🟡 تم اختيار: " + (device.name || "جهاز غير معروف");

    device.addEventListener(
      "gattserverdisconnected",
      disconnected
    );

    server = await device.gatt.connect();

    statusBox.textContent =
      "🟢 متصل: " + (device.name || "جهاز غير معروف");

    servicesBox.textContent =
      "🔍 جاري قراءة خدمات Bluetooth...";

    const services =
      await server.getPrimaryServices();

    servicesBox.innerHTML = "";

    if (services.length === 0) {
      servicesBox.textContent =
        "⚠️ لم يتم العثور على خدمات GATT.";
      return;
    }

    services.forEach(service => {

      const line = document.createElement("div");

      line.textContent =
        "Service: " + service.uuid;

      servicesBox.appendChild(line);
    });

    servicesBox.innerHTML +=
      "<br>⚠️ لم يتم تحديد بروتوكول السكوتر تلقائيًا.";

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "🔴 لم يتم الاتصال";

    servicesBox.textContent =
      "السبب: " + error.message;
  }
});

function disconnected() {

  statusBox.textContent =
    "🔴 تم قطع الاتصال";

  servicesBox.textContent =
    "تم فصل جهاز Bluetooth.";

  unlockBtn.disabled = true;
  lockBtn.disabled = true;
  connectBtn.disabled = false;
}
</script>

</body>
</html>
