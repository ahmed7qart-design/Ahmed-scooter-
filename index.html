<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHMED SCOOTER</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 94%;
      max-width: 600px;
      margin: auto;
      padding: 20px 0;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 18px;
    }

    .top {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .speed {
      width: 38%;
      min-height: 260px;
      background: #151515;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .speed-number {
      font-size: 55px;
      font-weight: bold;
    }

    .speed-unit {
      color: #aaa;
      font-size: 17px;
    }

    #map {
      width: 62%;
      height: 260px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #222;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #permissionBtn {
      background: #f59e0b;
      color: white;
    }

    #locationBtn {
      background: #1877f2;
      color: white;
    }

    #status {
      text-align: center;
      background: #151515;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      color: #ddd;
    }

    .legend {
      margin-top: 12px;
      background: #151515;
      border-radius: 14px;
      padding: 12px;
      line-height: 2;
      color: #ccc;
      font-size: 14px;
    }

    @media (max-width: 430px) {
      .speed-number {
        font-size: 42px;
      }

      .speed {
        min-height: 230px;
      }

      #map {
        height: 230px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🛴 AHMED SCOOTER</h1>

  <div class="subtitle">
    نظام متابعة السكوتر
  </div>

  <div class="top">

    <div class="speed">
      <div class="speed-number" id="speed">0</div>
      <div class="speed-unit">كم/س</div
