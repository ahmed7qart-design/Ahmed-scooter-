<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scooter GPS Pro</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b10;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;
 text-align:center;
 font-size:25px;
 font-weight:bold;
}
.dashboard{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:10px;
}
.card{
 background:#151a22;
 border-radius:18px;
 padding:15px;
 text-align:center;
 box-shadow:0 4px 15px #0006;
}
.card small{color:#9ca3af}
.value{
 display:block;
 font-size:27px;
 font-weight:bold;
 margin-top:7px;
}
.speed{
 grid-column:span 2;
}
.speed .value{
 font-size:55px;
}
#map{
 height:45vh;
 width:100%;
}
.controls{
 display:flex;
 gap:10px;
 padding:12px;
}
button{
 flex:1;
 border:0;
 border-radius:16px;
 padding:17px;
 color:white;
 font-size:18px;
 font-weight:bold;
}
#start{background:#00a86b}
#stop{background:#d32f2f}

.info{
 margin:10px;
 padding:15px;
 background:#151a22;
 border-radius:18px;
}
.info div{
 display:flex;
 justify-content:space-between;
 padding:8px 0;
 border-bottom:1px solid #292f39;
}
.info div:last-child{border:0}

.radar{
 margin:10px;
 background:#151a22;
 border-radius:20px;
 padding:20px;
 text-align:center;
}
.radarCircle{
 width:210px;
 height:210px;
 margin:auto;
 border:2px solid #00ff88;
 border-radius:50%;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle,transparent 20%,#00ff8815 21%,transparent 22%),
 linear-gradient(90deg,transparent 49.5%,#00ff8850 50%,transparent 50.5%),
 linear-gradient(0deg,transparent 49.5%,#00ff8850 50%,transparent 50.5%);
}
.scan{
 position:absolute;
 width:3px;
 height:50%;
 background:#00ff88;
 left:50%;
 bottom:50%;
 transform-origin:bottom;
 animation:scan 2s linear infinite;
}
.scooterDot{
 position:absolute;
 left:50%;
 top:50%;
 width:13px;
 height:13px;
 background:#00ff88;
 border-radius:50%;
 transform:translate(-50%,-50%);
}
.car{
 position:absolute;
 width:12px;
 height:12px;
 background:#ff4545;
 border-radius:50%;
 box-shadow:0 0 12px #ff4545;
}
@keyframes scan{
 from{transform:rotate(0deg)}
 to{transform:rotate(360deg)}
}
.status{
 text-align:center;
 padding:10px;
 color:#aaa;
}
</style>
</head>

<body>

<header>🛴 Scooter GPS Pro</header>

<div class="dashboard">

<div class="card speed">
<small>السرعة الحالية</small>
<span class="value" id="speed">0.0</span>
<small>كم / ساعة</small>
</div>

<div class="card">
<small>🏁 أعلى سرعة</small>
<span class="value" id="maxSpeed">0.0</span>
<small>كم/س</small>
</div>

<div class="card">
<small>📊 متوسط السرعة</small>
<span class="value" id="avgSpeed">0.0</span>
<small>كم/س</small>
</div>

<div class="card">
<small>🛣️ المسافة</small>
<span class="value" id="distance">0.00</span>
<small>كم</small>
</div>

<div class="card">
<small>⏱️ مدة
