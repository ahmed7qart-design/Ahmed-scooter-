<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ZIP إلى APK</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    .card {
      background: #222;
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      margin: auto;
    }

    button {
      background: #00c853;
      color: white;
      border: 0;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }

    input {
      margin: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>تحويل ZIP إلى APK</h2>

    <input type="file" id="zipFile" accept=".zip">

    <br>

    <button onclick="convert()">
      تحويل إلى APK
    </button>

    <p id="status"></p>
  </div>

  <script>
    function convert() {
      const file = document.getElementById("zipFile").files[0];
      const status = document.getElementById("status");

      if (!file) {
        status.textContent = "اختار ملف ZIP الأول";
        return;
      }

      status.textContent =
        "تم اختيار الملف. تحويل APK يحتاج Android Build وليس مجرد تغيير الامتداد.";
    }
  </script>
</body>
</html>
