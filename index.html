<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AHMED SCOOTER</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 92%;
      max-width: 430px;
      padding: 20px 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 18px;
    }

    #status {
      background: #151515;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin: 7px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #locationBtn {
      background: #1877f2;
      color: white;
    }

    #locationBtn:active {
      transform: scale(0.98);
    }

    #map {
      width: 100%;
      height: 280px;
      margin-top: 15px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #222;
    }

    .info {
      background: #151515;
      border-radius: 14px;
      padding: 13px;
      margin-top: 12px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🛴 AHMED SCOOTER</h1>

    <div class="subtitle">
      نظام متابعة السكوتر
    </div>

    <div id="status">
      📍 الموقع غير محدد
    </div>

    <button id="locationBtn">
      📍 تحديد موقعي
    </button>

    <div id="map"></div>

    <div class="info">
      الخريطة تعمل بشكل مستقل ولا تحتاج إلى Bluetooth.
    </div>

  </div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    const statusBox =
      document.getElementById("status");

    const locationBtn =
      document.getElementById("locationBtn");


    // إنشاء الخريطة
    const map =
      L.map("map").setView(
        [31.2001, 29.9187],
        13
      );


    // خريطة OpenStreetMap
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    let marker = null;


    // تحديد الموقع
    locationBtn.addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          statusBox.textContent =
            "❌ تحديد الموقع غير مدعوم";

          return;
        }


        statusBox.textContent =
          "🟡 جاري تحديد موقعك...";
