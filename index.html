<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIX / WG TWO - Scooter Monitor</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08111f;
  color:#fff;
}

header{
  padding:20px;
  background:#101b2d;
  border-bottom:1px solid #26364e;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  margin:0;
  font-size:21px;
}

.small{
  color:#91a0b5;
  font-size:13px;
  margin-top:6px;
}

main{
  width:min(900px,94%);
  margin:auto;
  padding:18px 0 40px;
}

.card{
  background:#101b2d;
  border:1px solid #26364e;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
}

.connection{
  text-align:center;
  padding:25px;
}

.dot{
  width:12px;
  height:12px;
  display:inline-block;
  border-radius:50%;
  background:#ef4444;
  margin-left:6px;
}

.connected{
  background:#22c55e;
}

.message{
  display:none;
  padding:15px;
  border-radius:14px;
  margin-bottom:16px;
  background:#132b42;
  border:1px solid #2563eb;
  text-align:center;
  font-weight:bold;
}

.speed{
  text-align:center;
  font-size:78px;
  font-weight:900;
}

.unit{
  text-align:center;
  color:#91a0b5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat{
  background:#17243a;
  border-radius:16px;
  padding:18px;
}

.stat-title{
  color:#91a0b5;
  font-size:14px;
}

.stat-value{
  margin-top:8px;
  font-size:27px;
  font-weight:bold;
}

button{
  border:0;
  color:white;
  background:#2563eb;
  padding:13px 18px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.full{
  width:100%;
  margin-top:12px;
}

.dataBox{
  direction:ltr;
  text-align:left;
  background:#070d17;
  padding:12px;
  border-radius:12px;
  max-height:280px;
  overflow:auto;
  font-family:monospace;
  font-size:12px;
}

.service{
  background:#17243a;
  padding:13px;
  border-radius:12px;
  margin-bottom:10px;
  direction:ltr;
  text-align:left;
}

.char{
  margin-top:9px;
  padding:9px;
  border-top:1px solid #33445c;
}

footer{
  text-align:center;
  color:#66758a;
  padding:20px;
}

@media(max-width:500px){
  .speed{
    font-size:60px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>🛴 LIX / WG TWO</h1>
    <div class="small" id="headerStatus">
      غير متصل
    </div>
  </div>
</header>

<main>

  <div id="message" class="message"></div>

  <section class="card connection">

    <div>
      <span id="dot" class="dot"></span>
      <span id="connectionStatus">
        السكوتر غير متصل
      </span>
    </div>

    <button
      id="connectButton"
      class="full"
      onclick="connectScooter()">
      🔵 الاتصال بالسكوتر
    </button>

  </section>

  <section class="card">

    <div class="speed">
      <span id="speed">--</span>
    </div>

    <div class="unit">
      السرعة كم/س
    </div>

  </section>

  <section class="grid">

    <div class="stat">
      <div class="stat-title">
        🔋 البطارية
      </div>
      <div id="battery" class="stat-value">
        --%
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        📏 المسافة
      </div>
      <div id="distance" class="stat-value">
        --
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        🌡️ بيانات إضافية
      </div>
      <div id="extra" class="stat-value">
        --
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        📡 حالة الاتصال
      </div>
      <div id="link" class="stat-value">
        غير متصل
      </div>
    </div>

  </section>

  <section class="card">

    <h3>📡 خدمات السكوتر</h3>

    <div class="small">
      الخدمات والخصائص التي أعلنها جهاز Bluetooth.
    </div>

    <br>

    <div id="services">
      لم يتم الاتصال بعد.
    </div>

  </section>

  <section class="card">

    <h3>📥 البيانات المستلمة</h3>

    <div id="dataLog" class="dataBox">
      في انتظار الاتصال...
    </div>

  </section>

</main>

<footer>
  LIX / WG TWO Scooter Monitor
</footer>

<script>

"use strict";

/* =====================================
   المتغيرات
===================================== */

let device = null;
let server = null;

let logLines = [];

/* =====================================
   عناصر الصفحة
===================================== */

const $ = id =>
  document.getElementById(id);

/* =====================================
   الرسائل
===================================== */

function showMessage(text){

  const box = $("message");

  box.textContent = text;
  box.style.display = "block";
}

/* =====================================
   Log
===================================== */

function addLog(text){

  const time =
    new Date().toLocaleTimeString();

  logLines.push(
    "[" + time + "] " + text
  );

  if(logLines.length > 200){
    logLines.shift();
  }

  $("dataLog").textContent =
    logLines.join("\n");

  $("dataLog").scrollTop =
    $("dataLog").scrollHeight;
}

/* =====================================
   تحويل البيانات إلى HEX
===================================== */

function toHex(data){

  let result = [];

  for(let i=0;i<data.byteLength;i++){

    result.push(
      data.getUint8(i)
        .toString(16)
        .padStart(2,"0")
        .toUpperCase()
    );
  }

  return result.join(" ");
}

/* =====================================
   تحويل البيانات إلى Decimal
===================================== */

function toDecimal(data){

  let result = [];

  for(let i=0;i<data.byteLength;i++){
    result.push(data.getUint8(i));
  }

  return result.join(" ");
}

/* =====================================
   Bluetooth
===================================== */

async function connectScooter(){

  if(!navigator.bluetooth){

    showMessage(
      "❌ هذا المتصفح لا يدعم Web Bluetooth"
    );

    addLog(
      "Web Bluetooth غير متاح."
    );

    return;
  }

  try{

    $("connectButton").disabled = true;

    showMessage(
      "🔵 اختر السكوتر من قائمة Bluetooth..."
    );

    addLog(
      "فتح قائمة أجهزة Bluetooth."
    );

    device =
      await navigator.bluetooth.requestDevice({

        acceptAllDevices:true,

        optionalServices:[
          "battery_service",
          "device_information"
        ]

      });

    addLog(
      "تم اختيار الجهاز: " +
      (device.name || "بدون اسم")
    );

    $("connectionStatus").textContent =
      "تم اختيار السكوتر";

    $("headerStatus").textContent =
      device.name || "LIX / WG TWO";

    device.addEventListener(
      "gattserverdisconnected",
      disconnected
    );

    showMessage(
      "🟡 تم العثور على السكوتر، جاري الاتصال..."
    );

    server =
      await device.gatt.connect();

    addLog(
      "تم اتصال GATT."
    );

    setConnected();

    showMessage(
      "🟢 تم الاتصال، جاري نقل معلومات السكوتر..."
    );

    await scanServices();

    await readStandardBattery();

    showMessage(
      "🟢 تم الاتصال بالسكوتر واستقبال البيانات المتاحة."
    );

  }catch(error){

    addLog(
      "ERROR: " +
      error.message
    );

    showMessage(
      "❌ لم يتم الاتصال بالسكوتر."
    );

    setDisconnected();

  }finally{

    $("connectButton").disabled = false;

  }
}

/* =====================================
   حالة الاتصال
===================================== */

function setConnected(){

  $("dot").classList.add("connected");

  $("connectionStatus").textContent =
    "السكوتر متصل";

  $("link").textContent =
    "متصل";

}

function setDisconnected(){

  $("dot").classList.remove("connected");

  $("connectionStatus").textContent =
    "السكوتر غير متصل";

  $("link").textContent =
    "غير متصل";

}

function disconnected(){

  addLog(
    "تم قطع اتصال Bluetooth."
  );

  setDisconnected();

  showMessage(
    "🔴 انقطع اتصال السكوتر."
  );
}

/* =====================================
   اكتشاف الخدمات
===================================== */

async function scanServices(){

  if(!server) return;

  const container =
    $("services");

  container.innerHTML = "";

  let services;

  try{

    services =
      await server.getPrimaryServices();

  }catch(error){

    addLog(
      "فشل الحصول على الخدمات: " +
      error.message
    );

    return;
  }

  addLog(
    "عدد الخدمات: " +
    services.length
  );

  for(const service of services){

    const serviceElement =
      document.createElement("div");

    serviceElement.className =
      "service";

    serviceElement.innerHTML =
      "<b>Service</b><br>" +
      service.uuid;

    container.appendChild(
      serviceElement
    );

    let characteristics = [];

    try{

      characteristics =
        await service.getCharacteristics();

    }catch(error){

      addLog(
        "فشل خصائص " +
        service.uuid
      );

      continue;
    }

    for(
      const characteristic
      of characteristics
    ){

      const props =
        characteristic.properties;

      const properties = [];

      if(props.read)
        properties.push("READ");

      if(props.write)
        properties.push("WRITE");

      if(props.writeWithoutResponse)
        properties.push(
          "WRITE WITHOUT RESPONSE"
        );

      if(props.notify)
        properties.push("NOTIFY");

      if(props.indicate)
        properties.push("INDICATE");

      const charElement =
        document.createElement("div");

      charElement.className =
        "char";

      charElement.innerHTML =

        "<b>Characteristic</b><br>" +

        characteristic.uuid +

        "<br><span class='small'>" +

        properties.join(" • ") +

        "</span>";

      serviceElement.appendChild(
        charElement
      );

      addLog(
        "CHAR: " +
        characteristic.uuid +
        " [" +
        properties.join(", ") +
        "]"
      );

      /* ===============================
         READ
      =============================== */

      if(props.read){

        try{

          const value =
            await characteristic.readValue();

          handleData(
            characteristic,
            value,
            "READ"
          );

        }catch(error){

          addLog(
            "READ failed " +
            characteristic.uuid
          );

        }

      }

      /* ===============================
         NOTIFY
      =============================== */

      if(props.notify){

        try{

          await characteristic
            .startNotifications();

          characteristic.addEventListener(
            "characteristicvaluechanged",
            event => {

              handleData(
                characteristic,
                event.target.value,
                "NOTIFY"
              );

            }
          );

          addLog(
            "Notifications enabled: " +
            characteristic.uuid
          );

        }catch(error){

          addLog(
            "NOTIFY failed " +
            characteristic.uuid
          );

        }

      }

    }

  }

}

/* =====================================
   استقبال بيانات فعلية
===================================== */

function handleData(
  characteristic,
  value,
  type
){

  const hex =
    toHex(value);

  const decimal =
    toDecimal(value);

  addLog(
    type +
    " " +
    characteristic.uuid +
    " | HEX: " +
    hex +
    " | DEC: " +
    decimal
  );

  /*
    لا نحول البيانات إلى سرعة أو بطارية
    هنا بشكل عشوائي.

    السبب:
    البروتوكول الخاص بالسكوتر غير معروف.
    البيانات المعروضة هي البيانات الحقيقية
    التي أرسلها الجهاز.
  */

}

/* =====================================
   Battery Service القياسي
===================================== */

async function readStandardBattery(){

  if(!server) return;

  try{

    const service =
      await server.getPrimaryService(
        "battery_service"
      );

    const characteristic =
      await service.getCharacteristic(
        "battery_level"
      );

    const value =
      await characteristic.readValue();

    const battery =
      value.getUint8(0);

    $("battery").textContent =
      battery + "%";

    addLog(
      "STANDARD BATTERY: " +
      battery +
      "%"
    );

    if(
      characteristic.properties.notify
    ){

      await characteristic
        .startNotifications();

      characteristic.addEventListener(
        "characteristicvaluechanged",
        event => {

          const battery =
            event.target.value.getUint8(0);

          $("battery").textContent =
            battery + "%";

          addLog(
            "BATTERY UPDATE: " +
            battery +
            "%"
          );

        }
      );

    }

  }catch(error){

    addLog(
      "السكوتر لا يوفر Battery Service القياسية."
    );

  }

}

/* =====================================
   فحص Bluetooth عند بدء الصفحة
===================================== */

(async function(){

  if(!navigator.bluetooth){

    addLog(
      "Web Bluetooth غير مدعوم."
    );

    return;
  }

  try{

    const available =
      await navigator.bluetooth
        .getAvailability();

    addLog(
      "Bluetooth available: " +
      available
    );

  }catch(error){

    addLog(
      "تعذر فحص Bluetooth."
    );

  }

})();

</script>

</body>
</html>
